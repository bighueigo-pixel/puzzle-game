<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幾何拼圖挑戰</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #f8f9fa;
    font-family: sans-serif;
    touch-action: none; /* 防止手機端拖曳時觸發螢幕滾動 */
  }
  
  #board {
    position: relative;
    width: 600px;
    height: 600px;
    background-color: #ffffff;
    border: 2px dashed #adb5bd;
    border-radius: 8px;
    margin-top: 20px;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }

  /* 提示底圖區域 (概略位置) */
  #silhouette-hint {
    position: absolute;
    width: 300px;
    height: 300px;
    top: 150px;
    left: 150px;
    border: 1px solid #e9ecef;
    background-color: #f1f3f5;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ced4da;
    z-index: 0;
  }

  .piece {
    position: absolute;
    cursor: grab;
    filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
    transition: transform 0.1s;
    z-index: 10;
  }
  
  .piece:active {
    cursor: grabbing;
    transform: scale(1.05);
  }

  /* 藍色頭部 (梯形) */
  #piece-blue {
    width: 120px; height: 69px;
    background: linear-gradient(135deg, #5ab9ea, #3b8d99);
    clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
    top: 30px; left: 30px;
  }

  /* 黃色頸部 (平行四邊形) */
  #piece-yellow {
    width: 160px; height: 69px;
    background: linear-gradient(135deg, #ffde59, #e8b923);
    clip-path: polygon(25% 0%, 100% 0%, 75% 100%, 0% 100%);
    top: 120px; left: 30px;
  }

  /* 紅色主體 (正六邊形) */
  #piece-red {
    width: 120px; height: 104px;
    background: linear-gradient(135deg, #ff5e62, #ff9966);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    top: 210px; left: 30px;
  }

  /* 綠色底部 (大正三角形) */
  #piece-green {
    width: 120px; height: 104px;
    background: linear-gradient(135deg, #a8e063, #56ab2f);
    clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
    top: 330px; left: 30px;
  }

  /* 橘黃色尾部 (不規則多邊形) */
  #piece-orange {
    width: 160px; height: 104px;
    background: linear-gradient(135deg, #ffc371, #ff5f6d);
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 50% 100%, 0% 50%);
    top: 450px; left: 30px;
  }

  .instructions {
    color: #495057;
    margin-top: 15px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="instructions">滑鼠按住（或手指觸控）彩色形狀即可拖曳，試著將它們拼在一起吧！</div>

<div id="board">
  <div id="silhouette-hint">拼圖區</div>
  
  <div id="piece-blue" class="piece"></div>
  <div id="piece-yellow" class="piece"></div>
  <div id="piece-red" class="piece"></div>
  <div id="piece-green" class="piece"></div>
  <div id="piece-orange" class="piece"></div>
</div>

<script>
  const pieces = document.querySelectorAll('.piece');
  const board = document.getElementById('board');
  let activePiece = null;
  let offsetX = 0;
  let offsetY = 0;
  let highestZIndex = 10;

  pieces.forEach(piece => {
    // 綁定滑鼠事件
    piece.addEventListener('mousedown', dragStart);
    // 綁定觸控事件
    piece.addEventListener('touchstart', dragStart, {passive: false});
  });

  // 綁定全域移動與結束事件
  document.addEventListener('mousemove', drag);
  document.addEventListener('touchmove', drag, {passive: false});
  document.addEventListener('mouseup', dragEnd);
  document.addEventListener('touchend', dragEnd);

  function dragStart(e) {
    if (e.target.classList.contains('piece')) {
      activePiece = e.target;
      highestZIndex++;
      activePiece.style.zIndex = highestZIndex; // 將正在拖曳的元件移至最上層

      // 判斷是滑鼠還是觸控
      const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

      const rect = activePiece.getBoundingClientRect();
      const boardRect = board.getBoundingClientRect();

      // 計算游標與元件左上角的相對距離
      offsetX = clientX - rect.left;
      offsetY = clientY - rect.top;
    }
  }

  function drag(e) {
    if (!activePiece) return;
    e.preventDefault(); // 防止手機端滑動螢幕

    const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
    const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

    const boardRect = board.getBoundingClientRect();

    // 更新元件在 board 內的相對座標
    let newX = clientX - boardRect.left - offsetX;
    let newY = clientY - boardRect.top - offsetY;

    activePiece.style.left = `${newX}px`;
    activePiece.style.top = `${newY}px`;
  }

  function dragEnd() {
    activePiece = null;
  }
</script>
</body>
</html>
