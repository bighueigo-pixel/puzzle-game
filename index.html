<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精確版：幾何三角拼圖挑戰</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #f8f9fa;
    font-family: sans-serif;
    touch-action: none; /* 防止手機拖曳時畫面滾動 */
    margin: 0;
    padding: 10px;
  }
  
  #board {
    position: relative;
    width: 100%;
    max-width: 600px;
    height: 70vh;
    background-color: #ffffff;
    border: 2px dashed #adb5bd;
    border-radius: 8px;
    margin-top: 15px;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }

  .piece {
    position: absolute;
    cursor: grab;
    transition: transform 0.1s;
    z-index: 10;
  }
  
  .piece:active {
    cursor: grabbing;
    transform: scale(1.05);
  }

  .instructions {
    color: #495057;
    margin-top: 10px;
    font-weight: bold;
    text-align: center;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="instructions">已升級為精準網格！<br>拖曳具有內部三角形分割線的拼圖來完成挑戰</div>

<div id="board">
  <!-- 拼圖容器 -->
  <div id="piece-blue" class="piece" style="top: 20px; left: 20px;"></div>
  <div id="piece-yellow" class="piece" style="top: 120px; left: 20px;"></div>
  <div id="piece-red" class="piece" style="top: 220px; left: 20px;"></div>
  <div id="piece-green" class="piece" style="top: 350px; left: 20px;"></div>
  <div id="piece-orange" class="piece" style="top: 480px; left: 20px;"></div>
</div>

<script>
  // === SVG 三角形網格生成引擎 ===
  const S = 50; // 三角形邊長
  const H = S * 0.866025; // 三角形高 (S * √3 / 2)

  // 根據圖片重建完美比例的拼圖資料 (c: 行, r: 列, t: 朝上或朝下)
  const piecesDef = {
    blue: {
      color: 'url(#grad-blue)',
      tris: [ {c:1,r:0,t:'up'}, {c:0,r:1,t:'up'}, {c:1,r:1,t:'down'}, {c:2,r:1,t:'up'} ]
    },
    yellow: {
      color: 'url(#grad-yellow)',
      tris: [ {c:0,r:0,t:'up'}, {c:1,r:0,t:'down'}, {c:2,r:0,t:'up'}, {c:3,r:0,t:'down'} ]
    },
    red: {
      color: 'url(#grad-red)',
      tris: [ {c:1,r:0,t:'down'}, {c:0,r:0,t:'up'}, {c:2,r:0,t:'up'}, {c:0,r:1,t:'down'}, {c:2,r:1,t:'down'}, {c:1,r:1,t:'up'} ]
    },
    green: {
      color: 'url(#grad-green)',
      tris: [ {c:0,r:0,t:'down'}, {c:1,r:0,t:'up'}, {c:2,r:0,t:'down'}, {c:1,r:1,t:'down'} ]
    },
    orange: {
      color: 'url(#grad-orange)',
      tris: [ {c:1,r:0,t:'up'}, {c:0,r:1,t:'up'}, {c:1,r:1,t:'down'}, {c:2,r:1,t:'up'}, {c:3,r:1,t:'down'}, {c:4,r:1,t:'up'} ]
    }
  };

  // 計算每個小三角形的頂點座標
  function getPoly(c, r, t) {
    const x = c * (S/2);
    const y = r * H;
    if (t === 'up') return `${x+S/2},${y} ${x},${y+H} ${x+S},${y+H}`; // 尖端朝上
    return `${x},${y} ${x+S},${y} ${x+S/2},${y+H}`; // 尖端朝下
  }

  // 漸層定義
  const gradients = `
    <defs>
      <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7dd3fc" /><stop offset="100%" stop-color="#0284c7" /></linearGradient>
      <linearGradient id="grad-yellow" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fef08a" /><stop offset="100%" stop-color="#ca8a04" /></linearGradient>
      <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fca5a5" /><stop offset="100%" stop-color="#dc2626" /></linearGradient>
      <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#bbf7d0" /><stop offset="100%" stop-color="#16a34a" /></linearGradient>
      <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fde047" /><stop offset="100%" stop-color="#ea580c" /></linearGradient>
    </defs>
  `;

  // 將資料渲染為 SVG 元素
  Object.keys(piecesDef).forEach(id => {
    const def = piecesDef[id];
    let svgHtml = `<svg width="250" height="120" style="filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.4)); overflow: visible;">${gradients}`;
    def.tris.forEach(tri => {
      svgHtml += `<polygon points="${getPoly(tri.c, tri.r, tri.t)}" fill="${def.color}" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>`;
    });
    svgHtml += `</svg>`;
    document.getElementById('piece-' + id).innerHTML = svgHtml;
  });

  // === 拖曳互動邏輯 ===
  const pieces = document.querySelectorAll('.piece');
  const board = document.getElementById('board');
  let activePiece = null;
  let offsetX = 0, offsetY = 0;
  let highestZIndex = 10;

  pieces.forEach(piece => {
    piece.addEventListener('mousedown', dragStart);
    piece.addEventListener('touchstart', dragStart, {passive: false});
  });

  document.addEventListener('mousemove', drag);
  document.addEventListener('touchmove', drag, {passive: false});
  document.addEventListener('mouseup', dragEnd);
  document.addEventListener('touchend', dragEnd);

  function dragStart(e) {
    let target = e.target.closest('.piece');
    if (target) {
      activePiece = target;
      highestZIndex++;
      activePiece.style.zIndex = highestZIndex;

      const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      const rect = activePiece.getBoundingClientRect();
      
      offsetX = clientX - rect.left;
      offsetY = clientY - rect.top;
    }
  }

  function drag(e) {
    if (!activePiece) return;
    e.preventDefault(); 

    const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
    const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    const boardRect = board.getBoundingClientRect();

    let newX = clientX - boardRect.left - offsetX;
    let newY = clientY - boardRect.top - offsetY;

    activePiece.style.left = `${newX}px`;
    activePiece.style.top = `${newY}px`;
  }

  function dragEnd() {
    activePiece = null;
  }
</script>
</body>
</html>
